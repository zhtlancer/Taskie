name: Checks

# Unit tests and every local browser suite, for pull requests and branches before they reach main.
# The publish workflow calls this too, so a failing suite also blocks a release.
on:
  pull_request:
  push:
    branches-ignore: [ "main" ]
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - run: npm ci --prefix frontend
      - name: Check repository content
        run: npm run check:repo
      - run: npm test
        env:
          # Each failing test also becomes an annotation with its file, line, diff and clock/time zone,
          # readable through the public API when the job log is not at hand.
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/scripts/test-annotations.mjs --test-reporter-destination=stdout

  backend-new-york:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TIME_ZONE: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - name: Backend tests in the family time zone
        run: npm run test:backend
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/scripts/test-annotations.mjs --test-reporter-destination=stdout

  # A NAS-style bind-mounted data directory against the real image: ownership, persistence across
  # container replacement, clear refusal of unwritable directories and of newer databases.
  docker-data:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build test image
        run: docker build -t taskie:reliability .
      - name: Data directory checks
        run: npm run test:docker-data

  # Upgrade regression: the backend of 0b4128c (v28, v1 backups) taken from git history writes data
  # and a v1 backup; this backend upgrades it and restores both backup formats. Needs full history.
  upgrade:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - name: Upgrade and restore from real old code
        run: npm run test:upgrade

  # The local browser suites run against an in-memory API and the production build, in the
  # runner's Google Chrome; each suite is its own job so one failure names the suite.
  browser-suites:
    needs: test
    runs-on: ubuntu-latest
    # Passing suites take under 3 minutes; the font steps' limits (2 + 12 minutes) still fit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [ time-stats, carry-over, homework, ui-refine, midnight, legacy, dialogs, board-class-actions, class-stats, class-count, running-timer, rest, photo-backup, photo-export, frontend-recovery ]
    env:
      # The files of Ubuntu's fonts-noto-cjk, from pinned upstream tags: Sans2.004 is byte-identical in
      # Ubuntu 24.04 and 26.04, Serif2.003 is the one in 26.04. A version change needs new checksums.
      NOTO_CJK_SANS: Sans2.004
      NOTO_CJK_SERIF: Serif2.003
      NOTO_CJK_SHA256: |
        b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
        faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
        5d9c31a059600193c9d7968a998bde886ccdc77e934006ad243b41794c496a7d  NotoSerifCJK-Regular.ttc
        1505ee3b9c0890fae6302ee0e9c6fd74d690f4a55a6ace1d9944f3f6352d622d  NotoSerifCJK-Bold.ttc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict
      - run: npm ci --prefix frontend
      # Chinese fonts as on real phones and tablets, so text is measured with real glyphs. They do not
      # stand in for minimum sizes: the suites also measure single-character labels.
      # apt is not used on the normal path: about a third of the runners stalled for 8-26 minutes in it.
      # The pinned files come from the cache or a checked download; a broken cache only costs a download.
      - name: Chinese font cache key
        id: font-key
        run: echo "key=noto-cjk-$NOTO_CJK_SANS-$NOTO_CJK_SERIF-$(printf '%s' "$NOTO_CJK_SHA256" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore Chinese fonts
        id: font-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ~/.cache/noto-cjk
          key: ${{ steps.font-key.outputs.key }}
      # Normally well under a minute; download (at most 150 s) plus the apt fallback (two attempts of
      # update 90 s + install 150 s) stay within the step limit. Stage times are in a notice annotation.
      - name: Install Chinese fonts
        id: fonts
        timeout-minutes: 12
        run: bash scripts/ci-install-fonts.sh
        env:
          CACHE_HIT: ${{ steps.font-cache.outputs.cache-hit }}
      - name: Save Chinese fonts
        if: steps.fonts.outputs.source == 'download'
        uses: actions/cache/save@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ~/.cache/noto-cjk
          key: ${{ steps.font-key.outputs.key }}
      - run: npm run build
      - name: Install Playwright (using the runner's Chrome)
        run: npm install --no-save --package-lock=false playwright@1.64.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Browser suite ${{ matrix.suite }}
        run: npm run test:browser:${{ matrix.suite }}
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
