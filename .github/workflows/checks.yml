name: Checks

# Unit tests and every local browser suite, for pull requests and branches before they reach main.
# The publish workflow calls this too, so a failing suite also blocks a release.
on:
  pull_request:
  push:
    branches-ignore: [ "main" ]
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - id: backend-install
        run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - id: frontend-install
        run: npm ci --prefix frontend
      - name: Check repository content
        run: npm run check:repo
      - name: Test CI diagnostics
        run: npm run test:ci-tools
      - run: npm test
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' && steps.frontend-install.outcome == 'success' }}
        env:
          # Each failing test also becomes an annotation with its file, line, diff and clock/time zone,
          # readable through the public API when the job log is not at hand.
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/scripts/test-annotations.mjs --test-reporter-destination=stdout

  # Audit failures still block publishing through the shared checks result, while independent
  # jobs continue to produce their test results. Audit both lockfiles, including build tools.
  dependency-audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm audit --prefix "${{ matrix.package }}" --package-lock-only --audit-level=moderate

  backend-time-zones:
    name: Backend (${{ matrix.time-zone }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        time-zone: [ America/New_York, Pacific/Kiritimati, Pacific/Pago_Pago ]
    env:
      # Keep the host clock distinct from the non-UTC family zones under test.
      TZ: UTC
      TIME_ZONE: ${{ matrix.time-zone }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - name: Backend tests in the family time zone
        run: npm run test:backend
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/scripts/test-annotations.mjs --test-reporter-destination=stdout

  # A NAS-style bind-mounted data directory against the real image: ownership, persistence across
  # container replacement, clear refusal of unwritable directories and of newer databases.
  # Reuse that image for browser smoke checks before a branch can reach main.
  docker-data:
    needs: test
    runs-on: ubuntu-latest
    # Leave room for the bounded font fallback, smoke timeout and artifact upload.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build test image
        id: image
        timeout-minutes: 10
        run: docker build -t taskie:reliability .
      - name: Data directory checks
        timeout-minutes: 5
        run: npm run test:docker-data
      - name: Chinese fonts
        id: fonts
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        timeout-minutes: 16
        uses: ./.github/actions/chinese-fonts
      - name: Install Playwright (using the runner's Chrome)
        id: playwright
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        timeout-minutes: 2
        run: npm install --no-save --package-lock=false playwright@1.64.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Container browser smoke
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.fonts.outcome == 'success' && steps.playwright.outcome == 'success' }}
        timeout-minutes: 7
        run: node scripts/run-browser-suite.cjs smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          BROWSER_DIAGNOSTICS_DIR: test-results/container-smoke
      - name: Upload container browser diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: container-browser-diagnostics
          path: test-results/container-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # Upgrade regression: the backend of 0b4128c (v28, v1 backups) taken from git history writes data
  # and a v1 backup; this backend upgrades it and restores both backup formats. Needs full history.
  upgrade:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - name: Upgrade and restore from real old code
        run: npm run test:upgrade

  # The local browser suites run against an in-memory API and the production build, in the
  # runner's Google Chrome; each suite is its own job so one failure names the suite.
  browser-suites:
    needs: test
    runs-on: ubuntu-latest
    # Passing suites take under 3 minutes. Reserve time for fonts, the bounded runner and upload.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [ family-time-zone, family-time-zone-shanghai, time-stats, carry-over, homework, homework-dates, completion-duration, task-priority, board-workflow, record-editing, refunds-drafts, ui-refine, midnight, dashboard-midnight, midnight-leftovers, legacy, dialogs, board-class-actions, class-stats, class-homework, class-count, class-move-dates, running-timer, rest, photo-backup, photo-export, frontend-recovery ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict
      - run: npm ci --prefix frontend
      - name: Chinese fonts
        timeout-minutes: 16
        uses: ./.github/actions/chinese-fonts
      - run: npm run build
        timeout-minutes: 3
      - name: Install Playwright (using the runner's Chrome)
        timeout-minutes: 2
        run: npm install --no-save --package-lock=false playwright@1.64.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Browser suite ${{ matrix.suite }}
        timeout-minutes: 7
        run: node scripts/run-browser-suite.cjs "${{ matrix.suite }}"
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          BROWSER_DIAGNOSTICS_DIR: test-results/${{ matrix.suite }}
      - name: Upload browser diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.suite }}
          path: test-results/${{ matrix.suite }}/
          if-no-files-found: ignore
          retention-days: 7
