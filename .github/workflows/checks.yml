name: Checks

# Unit tests and every local browser suite, for pull requests and branches before they reach main.
# The publish workflow calls this too, so a failing suite also blocks a release.
on:
  pull_request:
  push:
    branches-ignore: [ "main" ]
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - run: npm ci --prefix frontend
      - name: Check repository content
        run: npm run check:repo
      - run: npm test
        env:
          # Each failing test also becomes an annotation with its file, line, diff and clock/time zone,
          # readable through the public API when the job log is not at hand.
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/scripts/test-annotations.mjs --test-reporter-destination=stdout

  # A NAS-style bind-mounted data directory against the real image: ownership, persistence across
  # container replacement, clear refusal of unwritable directories and of newer databases.
  docker-data:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build test image
        run: docker build -t taskie:reliability .
      - name: Data directory checks
        run: npm run test:docker-data

  # Upgrade regression: the backend of 0b4128c (v28, v1 backups) taken from git history writes data
  # and a v1 backup; this backend upgrades it and restores both backup formats. Needs full history.
  upgrade:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict --ignore-scripts
      - name: Upgrade and restore from real old code
        run: npm run test:upgrade

  # The local browser suites run against an in-memory API and the production build, in the
  # runner's Google Chrome; each suite is its own job so one failure names the suite.
  browser-suites:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [ time-stats, carry-over, homework, ui-refine, midnight, legacy, dialogs, board-class-actions, class-stats, class-count, running-timer, rest, photo-backup, photo-export, frontend-recovery ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --omit=dev --engine-strict
      - run: npm ci --prefix frontend
      # Chinese fonts as on real phones and tablets, so text is measured with real glyphs. They do not
      # stand in for minimum sizes: the suites also measure single-character labels.
      - name: Install Chinese fonts
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh family | grep -q . || { echo 'No Chinese font installed'; exit 1; }
      - run: npm run build
      - name: Install Playwright (using the runner's Chrome)
        run: npm install --no-save --package-lock=false playwright@1.64.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Browser suite ${{ matrix.suite }}
        run: npm run test:browser:${{ matrix.suite }}
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
