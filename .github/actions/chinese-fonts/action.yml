name: Chinese fonts
description: Install and verify the pinned Noto CJK fonts shared by all browser checks
inputs:
  sans-version:
    description: Upstream Noto Sans CJK tag
    default: Sans2.004
  serif-version:
    description: Upstream Noto Serif CJK tag
    default: Serif2.003
  checksums:
    description: SHA256 manifest for the four font files
    default: |
      b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  NotoSansCJK-Regular.ttc
      faa5f3656a78b2e2d450d27fe8382c778bc2b6bb5ea29c986664a6a435056ceb  NotoSansCJK-Bold.ttc
      5d9c31a059600193c9d7968a998bde886ccdc77e934006ad243b41794c496a7d  NotoSerifCJK-Regular.ttc
      1505ee3b9c0890fae6302ee0e9c6fd74d690f4a55a6ace1d9944f3f6352d622d  NotoSerifCJK-Bold.ttc
runs:
  using: composite
  steps:
    - name: Chinese font cache key
      id: font-key
      shell: bash
      env:
        NOTO_CJK_SANS: ${{ inputs.sans-version }}
        NOTO_CJK_SERIF: ${{ inputs.serif-version }}
        NOTO_CJK_SHA256: ${{ inputs.checksums }}
      run: echo "key=noto-cjk-$NOTO_CJK_SANS-$NOTO_CJK_SERIF-$(printf '%s' "$NOTO_CJK_SHA256" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Restore Chinese fonts
      id: font-cache
      uses: actions/cache/restore@v6
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
      with:
        path: ~/.cache/noto-cjk
        key: ${{ steps.font-key.outputs.key }}
    - name: Install Chinese fonts
      id: fonts
      shell: bash
      run: timeout 12m bash scripts/ci-install-fonts.sh
      env:
        CACHE_HIT: ${{ steps.font-cache.outputs.cache-hit }}
        NOTO_CJK_SANS: ${{ inputs.sans-version }}
        NOTO_CJK_SERIF: ${{ inputs.serif-version }}
        NOTO_CJK_SHA256: ${{ inputs.checksums }}
    - name: Save Chinese fonts
      if: steps.fonts.outputs.source == 'download'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ~/.cache/noto-cjk
        key: ${{ steps.font-key.outputs.key }}
