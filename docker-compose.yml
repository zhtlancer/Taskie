services:
  taskie:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zhtlancer/taskie:latest
    container_name: taskie-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/data.sqlite
      - UPLOAD_DIR=/app/data/uploads
      - DEFAULT_PARENT_PIN=1234
      - TIME_ZONE=Asia/Shanghai
      - BACKUP_INTERVAL_HOURS=24
      - BACKUP_RETENTION=7
      # 运行程序的用户（启动时自动接管 ./data）。保持默认即可；如需修改，请使用专用普通账户的 uid/gid，不要使用管理员账户
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data:/app/data
